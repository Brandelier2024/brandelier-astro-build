name: Test, Build & Deploy to Hostinger

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - wordpress_post_published
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js & Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies (uses cache)
        run: npm ci

      - name: 🧪 Run Automated Unit Tests
        run: npm test

      - name: 🏗️ Build Astro Site (Pulling Fresh WordPress Posts)
        run: npm run build
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          PUBLIC_BRANDELIER_FORM_TOKEN: ${{ secrets.PUBLIC_BRANDELIER_FORM_TOKEN }}

      - name: 🚀 Sync Changed Files to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
